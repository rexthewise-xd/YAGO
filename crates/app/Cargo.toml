[package]
name = "yago-app"
version = "0.1.0"
edition = "2021"
rust-version = "1.92.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
enigo = "0.3"
reqwest = { version = "0.12", features = ["json"] }
walkdir = "2.5.0"
urlencoding = "2"
include_dir = "0.7"
dirs = "6"

vfs = { path = "../vfs" }
storage = { path = "../storage" }
resources = { path = "../resources" }
ini = { path = "../ini" }
mod_patches = { path = "../mod_patches" }
launcher = { path = "../launcher" }
loader = { path = "../loader" }
sync = { path = "../sync" }

[dev-dependencies]
tempfile = "3"